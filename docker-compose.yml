services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meeting_mvp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meeting_mvp"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - meeting_mvp_postgres:/var/lib/postgresql/data

  db_test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: meeting_mvp_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meeting_mvp_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  meeting_mvp_postgres:

